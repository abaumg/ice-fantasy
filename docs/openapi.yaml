              description: Tore
            assist:
              type: integer
              description: Assists
            penalty_minutes:
              type: integer
              description: Strafminuten
            positives:
              type: integer
              description: Plus-Punkte (Plus/Minus)
            negatives:
              type: integer
              description: Minus-Punkte (Plus/Minus)
            shots:
              type: integer
              description: Torschüsse
            faceoffs_win:
              type: integer
              description: Gewonnene Bullys
            faceoffs_lost:
              type: integer
              description: Verlorene Bullys
            time_on_ice:
              type: integer
              description: Eiszeit in Sekunden

    MatchTeam:
