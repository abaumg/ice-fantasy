  /leagues/part-round:
    get:
      tags: [league]
      operationId: getLeaguePartRounds
      summary: Spielrunden der Saison abrufen
      parameters:
        - name: league
          in: query
          required: true
          description: Liga-ID
          schema:
            type: integer
          example: 1
        - name: season
          in: query
          required: true
          description: Startjahr der Saison (2026 = Saison 2026/27)
          schema:
            type: integer
          example: 2026
      responses:
        "200":
          description: Bisherige Spielrunden, aufsteigend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaguePartRound"
              example:
                - leaguePartRoundId: 8
                  leaguePartId: 56
                  leaguePartName: ICEHL 2026/27
                  round: 8
                  startDate: "2026-09-28"
                  endDate: "2026-09-30"
                - leaguePartRoundId: 10
                  leaguePartId: 56
                  leaguePartName: ICEHL 2026/27
                  round: 9
                  startDate: "2026-10-01"
                  endDate: "2026-10-02"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`access_token` aus `/auth/register` oder `/auth/login`."
    apiKeyAsBearer:
      type: http
      scheme: bearer
      description: Statischer App-Schlüssel für Aufrufe ohne eingeloggten Nutzer.

  schemas:
    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT für die `/fantasy/*`-Endpunkte
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9....
        refresh_token:
          type: string
          example: 09cb38f60568a19579fca557fdb4786d7bd1a17b467a544a524694b79b274c66
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Gültigkeit des `access_token` in Sekunden
          example: 3600
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, first_name, last_name, phone, favourite_team]
      properties:
        id:
          type: integer
          description: Nutzer-ID (entspricht dem `sub`-Claim des JWT)
          example: 1744
        email:
          type: string
          example: max.mustermann@example.com
        first_name:
          nullable: true
          description: Vorname
        last_name:
          nullable: true
          description: Nachname
        phone:
          nullable: true
          description: Telefonnummer
        favourite_team:
          nullable: true
          description: Lieblingsverein

    FantasyTeam:
      type: object
      required: [id, name, points, ranking, hasJokerRoster]
      properties:
        id:
          type: integer
          description: Team-ID
          example: 1234
        name:
          type: string
          example: HC Beispiel
        points:
          type: number
          nullable: true
          description: Gesamtpunkte
          example: 30.0
        ranking:
          type: integer
          nullable: true
          description: Platzierung in der Gesamtrangliste
          example: 558
        hasJokerRoster:
          type: boolean

    FantasyTeamCreated:
      type: object
      required: [success, team]
      properties:
        success:
          type: boolean
          example: true
        team:
          type: integer
          description: ID des neuen Teams
          example: 1234

    FantasyRoster:
      type: object
      description: >
        Ohne gespeicherte Aufstellung fehlen alle nicht erforderlichen Felder.
        Bei einer unbesetzten Position sind Spieler und Preis `null`, die
        Punkte 0.0.
      required: [rosterId, isJokerRoster, totalPoints, budget]
      properties:
        rosterId:
          type: integer
          nullable: true
          description: Roster-ID
          example: 1981
        isJokerRoster:
          type: boolean
        totalPoints:
          type: number
          description: Gesamtpunkte des Rosters
          example: 0.0
        budget:
          $ref: "#/components/schemas/FantasyBudget"
        team:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              description: Team-ID
            name:
              type: string
        captain:
          nullable: true
          description: Captain der Aufstellung
        goalie:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Goalie
        leftDefender:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Linker Verteidiger
        rightDefender:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Rechter Verteidiger
        leftForward:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Linker Flügel
        centerForward:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Center
        rightForward:
          type: object
          allOf:
            - $ref: "#/components/schemas/FantasyPlayer"
          nullable: true
          description: Rechter Flügel
        goaliePrice:
          type: integer
          nullable: true
          description: Preis des Goalies
        leftDefenderPrice:
          type: integer
          nullable: true
          description: Preis des linken Verteidigers
        rightDefenderPrice:
          type: integer
          nullable: true
          description: Preis des rechten Verteidigers
        leftForwardPrice:
          type: integer
          nullable: true
          description: Preis des linken Flügels
        centerForwardPrice:
          type: integer
          nullable: true
          description: Preis des Centers
        rightForwardPrice:
          type: integer
          nullable: true
          description: Preis des rechten Flügels
        goaliePoints:
          type: number
          description: Punkte des Goalies
        leftDefenderPoints:
          type: number
          description: Punkte des linken Verteidigers
        rightDefenderPoints:
          type: number
          description: Punkte des rechten Verteidigers
        leftForwardPoints:
          type: number
          description: Punkte des linken Flügels
        centerForwardPoints:
          type: number
          description: Punkte des Centers
        rightForwardPoints:
          type: number
          description: Punkte des rechten Flügels

    FantasyPlayer:
      type: object
      required:
        - playerId
        - rosterPlayerId
        - firstName
        - lastName
        - imageUrl
        - jersey
        - teamId
        - teamName
        - teamShortcut
        - teamLogo
        - fantasyPrice
        - position
      properties:
        playerId:
          type: integer
          example: 1001
        rosterPlayerId:
          type: integer
          description: >
            Fantasy-ID des Spielers, gleich in allen Runden; wird beim Speichern
            der Aufstellung verwendet
          example: 20001
        firstName:
          type: string
        lastName:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: Foto des Spielers
          example: https://example.com/players/1001.jpg
        jersey:
          type: integer
          description: Trikotnummer
          example: 30
        teamId:
          type: integer
          description: ID des Vereins
          example: 1
        teamName:
          type: string
          example: Beispiel Eagles
        teamShortcut:
          type: string
          example: BEA
        teamLogo:
          type: string
          format: uri
          example: https://example.com/logos/1.png
        fantasyPrice:
          type: integer
          description: Preis im Fantasy-Spiel
          example: 160000
        position:
          type: string
          enum: [GK, DE, FW]
          description: Goalie (`GK`), Verteidiger (`DE`) oder Forward (`FW`, Flügel oder Center)

    FantasyBudget:
      type: object
      required: [total, current, playersPrice]
      properties:
        total:
          type: integer
          description: Maximalbudget, das insgesamt zur Verfügung steht
          example: 1000000
        current:
          type: integer
          description: Noch nicht ausgegebenes Budget (Maximalbudget abzüglich Spielerpreise)
          example: 13000
        playersPrice:
          type: integer
          description: Summe der Preise der aufgestellten Spieler
          example: 987000

    FantasyRosterUpdate:
      type: object
      description: >
        Position: `rosterPlayerId` des Spielers, leerer Wert = unbesetzt.
      required:
        - team
        - leaguePartRound
        - goalie
        - leftDefender
        - rightDefender
        - leftForward
        - centerForward
        - rightForward
        - captain
      properties:
        team:
          type: integer
          description: Team-ID
        leaguePartRound:
          type: integer
          description: "`leaguePartRoundId` der Runde"
        goalie:
          type: string
          description: Goalie
        leftDefender:
          type: string
          description: Linker Verteidiger
        rightDefender:
          type: string
          description: Rechter Verteidiger
        leftForward:
          type: string
          description: Linker Flügel
        centerForward:
          type: string
          description: Center
        rightForward:
          type: string
          description: Rechter Flügel
        captain:
          type: string
          description: Captain, leerer Wert = keiner

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Fehlermeldung (englisch)

    LeaguePartRound:
      type: object
      required:
        - leaguePartRoundId
        - leaguePartId
        - leaguePartName
        - round
        - startDate
        - endDate
      properties:
        leaguePartRoundId:
          type: integer
          description: >
            ID der Runde für `leaguePartRound`; weicht von `round` ab, IDs
            können fehlen
          example: 10
        leaguePartId:
          type: integer
          description: ID des Saisonabschnitts
          example: 56
        leaguePartName:
          type: string
          example: ICEHL 2026/27
        round:
          type: integer
          description: Rundennummer ab 1
          example: 9
        startDate:
          type: string
          format: date
          example: "2026-10-01"
        endDate:
          type: string
          format: date
          example: "2026-10-02"

    PlayerDetail:
      type: object
      required:
        - id
        - first_name
        - last_name
        - photo
        - weight
        - height
        - stick
        - position
        - birthdate
        - age
        - team_id
        - team_name
        - team_shortcut
        - team_logo
        - jersey
        - matches
        - league_stats
      properties:
        id:
          type: integer
          description: "`playerId`"
        first_name:
          type: string
        last_name:
          type: string
        photo:
          type: string
          format: uri
          nullable: true
        weight:
          type: integer
          description: Gewicht in kg
        height:
          type: integer
          description: Größe in cm
        stick:
          type: string
          example: L
          description: Schusshand
        position:
          type: string
          enum: [GK, DE, FW]
          description: Goalie (`GK`), Verteidiger (`DE`) oder Forward (`FW`)
        birthdate:
          type: string
          format: date
        age:
          type: integer
        team_id:
          type: integer
          description: ID des Vereins
        team_name:
          type: string
          description: Kurzname des Vereins
        team_shortcut:
          type: string
        team_logo:
          type: string
          format: uri
        jersey:
          type: integer
          description: Trikotnummer
        matches:
          type: array
          description: Einsätze in der Saison, neueste zuerst
          items:
            oneOf:
              - $ref: "#/components/schemas/GoalieMatch"
              - $ref: "#/components/schemas/SkaterMatch"
        league_stats:
          type: array
          description: Saisonstatistik je Liga
          items:
            oneOf:
              - $ref: "#/components/schemas/GoalieLeagueStats"
              - $ref: "#/components/schemas/SkaterLeagueStats"

    PlayerMatch:
      type: object
      required:
        - id
        - date
        - time
        - number
        - round
        - arena
        - home
        - visitor
        - has_shootout
        - has_overtime
        - status
        - actual_time
        - match_time
        - bets
        - home_score
        - visitor_score
        - period_score
        - event
      properties:
        id:
          type: integer
          description: Spiel-ID
        date:
          type: string
          format: date
        time:
          type: string
          example: "17:00"
          description: Anspielzeit (HH:MM)
        number:
          type: integer
          description: Spielnummer in der Saison
        round:
          type: string
          example: "10"
          description: Spieltag der Liga (nicht die Fantasy-Runde)
        arena:
          type: string
        home:
          $ref: "#/components/schemas/MatchTeam"
        visitor:
          $ref: "#/components/schemas/MatchTeam"
        has_shootout:
          type: boolean
        has_overtime:
          type: boolean
        status:
          type: string
          example: po zápase
          description: Spielstatus (tschechisch)
        actual_time:
          type: string
          example: KP
          description: >
            Spielende: `K` regulär, `KP` nach Verlängerung, `KN` nach
            Penaltyschießen
        match_time:
          nullable: true
        bets:
          type: object
          required: [homeWin, draw, visitorWin]
          description: Wettquoten
          properties:
            homeWin:
              type: number
              nullable: true
            draw:
              type: number
              nullable: true
            visitorWin:
              type: number
              nullable: true
        home_score:
          type: integer
        visitor_score:
          type: integer
        period_score:
          type: array
          items:
            $ref: "#/components/schemas/PeriodScore"
        event:
          type: object
          required: [id, event_name, event_part_name]
          properties:
            id:
              type: integer
              description: Liga-ID
            event_name:
              type: string
              example: ICEHL
            event_part_name:
              type: string
              example: ICEHL 2026/27

    GoalieMatch:
      allOf:
        - $ref: "#/components/schemas/PlayerMatch"
        - type: object
          required: [goals_against, saves, time_on_ice, penalty_minutes, assist]
          properties:
            goals_against:
              type: integer
              description: Gegentore
            saves:
              type: integer
              description: Paraden
            time_on_ice:
              type: integer
              description: Eiszeit in Sekunden
            penalty_minutes:
              type: integer
              description: Strafminuten
            assist:
              type: integer
              description: Assists

    SkaterMatch:
      allOf:
