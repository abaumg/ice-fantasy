openapi: 3.0.3
info:
  title: ICEHL Fantasy API
  version: "0.1"
  description: >
    Inoffizielle Beschreibung der Fantasy-League-API der App "win2day ICE Hockey League".
servers:
  - url: https://icehl.hokejovyzapis.cz/api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registrierung und Login
  - name: fantasy-team
    description: Eigenes Fantasy-Team
  - name: fantasy-roster
    description: Aufstellung und Budget
  - name: fantasy-results
    description: Ranglisten
  - name: players
    description: Spielermarkt und Spielerprofile
  - name: league
    description: Spielrunden

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Nutzer registrieren
      description: Legt den Nutzer an und liefert direkt ein Token-Paar.
      security:
        - apiKeyAsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: max.mustermann@example.com
              password: geheim123
      responses:
        "200":
          description: Nutzer angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Einloggen
      description: Liefert für einen registrierten Nutzer ein neues Token-Paar.
      security:
        - apiKeyAsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: max.mustermann@example.com
              password: geheim123
      responses:
        "200":
          description: Login erfolgreich
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /fantasy/teams:
    get:
      tags: [fantasy-team]
      operationId: getFantasyTeam
      summary: Eigenes Fantasy-Team abrufen
      responses:
        "200":
          description: Team oder `null`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FantasyTeam"
                  - type: object
                    nullable: true
                    enum: [null]
                    description: Kein Team vorhanden
              examples:
                kein-team:
                  value: null
                neues-team:
                  value:
                    id: 1234
                    name: HC Beispiel
                    points: null
                    ranking: null
                    hasJokerRoster: false
                team-mit-punkten:
                  value:
                    id: 5678
                    name: HC Beispiel
                    points: 30.0
                    ranking: 558
                    hasJokerRoster: false
    post:
      tags: [fantasy-team]
      operationId: createFantasyTeam
      summary: Fantasy-Team anlegen
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Teamname
            example:
              name: HC Beispiel
      responses:
        "200":
          description: Team angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantasyTeamCreated"

  /fantasy/rosters:
    get:
      tags: [fantasy-roster]
      operationId: getFantasyRoster
      summary: Roster und Budget eines Teams in einer Runde abrufen
      parameters:
        - name: team
          in: query
          required: true
          description: Team-ID
          schema:
            type: integer
          example: 1234
        - name: leaguePartRound
          in: query
          required: true
          description: >
            `leaguePartRoundId` aus `/leagues/part-round` (nicht die
            Rundennummer)
          schema:
            type: integer
          example: 2
      responses:
        "200":
          description: Roster und Budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FantasyRoster"
              examples:
                leer:
                  value:
                    rosterId: null
                    isJokerRoster: false
                    totalPoints: 0.0
                    budget:
                      total: 1000000
                      current: 1000000
                      playersPrice: 0
                aufgestellt:
                  value:
                    rosterId: 1981
                    isJokerRoster: false
                    totalPoints: 0.0
                    budget:
                      total: 1000000
                      current: 13000
                      playersPrice: 987000
                    team: { id: 5678, name: HC Beispiel }
                    captain: null
                    goalie:
                      playerId: 1001
                      rosterPlayerId: 20001
                      firstName: Anton
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1001.jpg
                      jersey: 30
                      teamId: 1
                      teamName: Beispiel Eagles
                      teamShortcut: BEA
                      teamLogo: https://example.com/logos/1.png
                      fantasyPrice: 160000
                      position: GK
                    leftDefender:
                      playerId: 1002
                      rosterPlayerId: 20002
                      firstName: Bruno
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1002.jpg
                      jersey: 4
                      teamId: 2
                      teamName: Muster Bears
                      teamShortcut: MBE
                      teamLogo: https://example.com/logos/2.png
                      fantasyPrice: 110000
                      position: DE
                    rightDefender:
                      playerId: 1003
                      rosterPlayerId: 20003
                      firstName: Carl
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1003.jpg
                      jersey: 5
                      teamId: 3
                      teamName: Test Wolves
                      teamShortcut: TWO
                      teamLogo: https://example.com/logos/3.png
                      fantasyPrice: 152000
                      position: DE
                    leftForward:
                      playerId: 1004
                      rosterPlayerId: 20004
                      firstName: David
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1004.jpg
                      jersey: 11
                      teamId: 3
                      teamName: Test Wolves
                      teamShortcut: TWO
                      teamLogo: https://example.com/logos/3.png
                      fantasyPrice: 241000
                      position: FW
                    centerForward:
                      playerId: 1005
                      rosterPlayerId: 20005
                      firstName: Emil
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1005.jpg
                      jersey: 16
                      teamId: 2
                      teamName: Muster Bears
                      teamShortcut: MBE
                      teamLogo: https://example.com/logos/2.png
                      fantasyPrice: 92000
                      position: FW
                    rightForward:
                      playerId: 1006
                      rosterPlayerId: 20006
                      firstName: Fritz
                      lastName: Beispiel
                      imageUrl: https://example.com/players/1006.jpg
                      jersey: 64
                      teamId: 4
                      teamName: Demo Sharks
                      teamShortcut: DSH
                      teamLogo: https://example.com/logos/4.png
                      fantasyPrice: 232000
                      position: FW
                    goaliePrice: 160000
                    leftDefenderPrice: 110000
                    rightDefenderPrice: 152000
                    leftForwardPrice: 241000
                    centerForwardPrice: 92000
                    rightForwardPrice: 232000
                    goaliePoints: 0.0
                    leftDefenderPoints: 0.0
                    rightDefenderPoints: 0.0
                    leftForwardPoints: 0.0
                    centerForwardPoints: 0.0
                    rightForwardPoints: 0.0
    post:
      tags: [fantasy-roster]
      operationId: saveFantasyRoster
      summary: Aufstellung speichern (Spieler kaufen oder verkaufen)
      description: >
        Überschreibt die komplette Aufstellung der Runde. Kaufen = Spieler auf
        eine leere Position setzen, Verkaufen = Position leer lassen. Alle
        Positionen werden immer mitgeschickt, Spieler über ihre
        `rosterPlayerId`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FantasyRosterUpdate"
            examples:
              goalie-verkaufen:
                value:
                  team: 5678
                  leaguePartRound: 2
                  goalie: ""
                  leftDefender: "20002"
                  rightDefender: "20003"
                  leftForward: "20004"
                  centerForward: "20005"
                  rightForward: "20006"
                  captain: ""
              goalie-kaufen:
                value:
                  team: 5678
                  leaguePartRound: 2
                  goalie: "20007"
                  leftDefender: "20002"
                  rightDefender: "20003"
                  leftForward: "20004"
                  centerForward: "20005"
                  rightForward: "20006"
                  captain: ""
      responses:
        "200":
          description: Aufstellung gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Aufstellung ungültig, nichts gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You can choose only a maximum of 2 players from the same team in your lineup.

  /fantasy/ranking:
    get:
      tags: [fantasy-results]
      operationId: getFantasyRanking
      summary: Platzierung eines Teams abrufen
      parameters:
        - name: team
          in: query
          required: true
          description: Team-ID
          schema:
            type: integer
          example: 5678
      responses:
        "200":
          description: Rangeintrag oder `null`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FantasyResultEntry"
                  - type: object
                    nullable: true
                    enum: [null]
                    description: Noch keine Platzierung
              examples:
                ohne-punkte:
                  value: null
                mit-punkten:
                  value:
                    id: 5678
                    name: HC Beispiel
                    points: 30.0
                    ranking: 558

  /fantasy/results:
    get:
      tags: [fantasy-results]
      operationId: getFantasyResults
      summary: Rangliste aller Fantasy-Teams abrufen
      description: Absteigend nach Punkten sortiert.
      parameters:
        - name: league
          in: query
          required: true
          description: Liga-ID
          schema:
            type: integer
          example: 1
        - name: season
          in: query
          required: true
          description: Startjahr der Saison (2026 = Saison 2026/27)
          schema:
            type: integer
          example: 2026
        - name: start
          in: query
          required: true
          description: Nullbasierter Offset in der Liste, nicht der Rang (Ränge können fehlen)
          schema:
            type: integer
            minimum: 0
          example: 50
        - name: count
          in: query
          required: true
          description: Anzahl Einträge pro Seite
          schema:
            type: integer
          example: 50
      responses:
        "200":
          description: Eine Seite der Rangliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FantasyResultEntry"
              example:
                - id: 101
                  name: Beispiel-Team A
                  points: 71.0
                  ranking: 1
                - id: 102
                  name: Beispiel-Team B
                  points: 66.5
                  ranking: 2

  /players/fantasy:
    get:
      tags: [players]
      operationId: getFantasyPlayers
      summary: Spieler einer Position mit Fantasy-Preis abrufen
      description: Nach Nachname sortiert.
      parameters:
        - name: league
          in: query
          required: true
          description: Liga-ID
          schema:
            type: integer
          example: 1
        - name: season
          in: query
          required: true
          description: Startjahr der Saison (2026 = Saison 2026/27)
          schema:
            type: integer
          example: 2026
        - name: position
          in: query
          required: true
          description: Goalie (`GK`), Verteidiger (`DE`) oder Forward (`FW`)
          schema:
            type: string
            enum: [GK, DE, FW]
          example: GK
        - name: start
          in: query
          required: true
          description: Nullbasierter Offset in der Liste
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: count
          in: query
          required: true
          description: Anzahl Einträge pro Seite
          schema:
            type: integer
          example: 50
      responses:
        "200":
          description: Eine Seite der Spielerliste
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FantasyPlayer"
              example:
                - playerId: 1007
                  rosterPlayerId: 20007
                  firstName: Gustav
                  lastName: Beispiel
                  jersey: 35
                  teamId: 5
                  teamName: Probe Lions
                  teamShortcut: PLI
                  fantasyPrice: 150000
                  position: GK
                  imageUrl: https://example.com/players/1007.jpg
                  teamLogo: https://example.com/logos/5.png

  /players/detail:
    get:
      tags: [players]
      operationId: getPlayerDetail
      summary: Spielerprofil mit Saisonstatistik abrufen
      parameters:
        - name: id
          in: query
          required: true
          description: "`playerId`"
          schema:
            type: integer
          example: 1004
        - name: season
          in: query
          required: true
          description: Startjahr der Saison (2026 = Saison 2026/27)
          schema:
            type: integer
          example: 2026
      responses:
        "200":
          description: Spielerprofil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDetail"
              example:
                id: 1004
                first_name: David
                last_name: Beispiel
                photo: https://example.com/players/1004.jpg
